<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e1d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#d6deef" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Renkli suları tüplere ayırdığın bulmaca oyunu." />
    <title>suloop · Su sıralama oyunu</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="Oyun alanı"></canvas>

    <header class="hud">
      <div class="hud-info">
        <strong id="title">Seviye 1</strong>
        <span id="subtitle">Kolay · 0 hamle</span>
      </div>
      <nav class="hud-actions">
        <button id="info" type="button" class="icon" aria-label="Bu seviyenin kuralları">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5" />
            <path d="M12 11v6M12 7.2v.1" />
          </svg>
        </button>
        <button id="levels-open" type="button" class="primary">Seviyeler</button>
      </nav>
    </header>

    <nav class="toolbar" aria-label="Hamleler">
      <button id="undo" type="button" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 7 4 12l5 5" />
          <path d="M4.5 12H14a5.5 5.5 0 0 1 0 11h-2" />
        </svg>
        <span>Geri al</span>
        <span class="count" hidden></span>
      </button>
      <button id="hint" type="button" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 18h6M10 21.5h4" />
          <path
            d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.7h6c0-.7.3-1.3.8-1.7A6.5 6.5 0 0 0 12 2.5Z"
          />
        </svg>
        <span>İpucu</span>
        <span class="count"></span>
      </button>
      <button id="restart" type="button" class="tool">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.3-5.6" />
          <path d="M20 4v5h-5" />
        </svg>
        <span>Baştan</span>
      </button>
    </nav>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="win" class="overlay" hidden>
      <div class="card win" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <div id="win-stars" class="win-stars" role="img"></div>
        <h2 id="win-title">Tebrikler!</h2>
        <dl class="win-stats">
          <div>
            <dt>Hamlen</dt>
            <dd id="win-moves"></dd>
          </div>
          <div>
            <dt id="win-fewest-label">En az</dt>
            <dd id="win-fewest"></dd>
          </div>
        </dl>
        <ul id="win-notes" class="win-notes"></ul>
        <section id="win-attempts-section" class="attempts-section">
          <h3>Son denemeler</h3>
          <ol id="win-attempts" class="attempts"></ol>
        </section>
        <div class="card-actions">
          <button id="replay" type="button">Tekrar et</button>
          <button id="next" type="button" class="primary">Sonraki seviye</button>
        </div>
        <button id="win-levels" type="button" class="link">Seviyeler</button>
      </div>
    </div>

    <div id="rules" class="overlay" hidden>
      <div class="card rules" role="dialog" aria-modal="true" aria-labelledby="rules-title">
        <header class="dialog-header">
          <h2 id="rules-title">Kurallar</h2>
          <button id="rules-close" type="button" class="icon" aria-label="Kapat">✕</button>
        </header>
        <div id="rules-body" class="rules-body"></div>
        <button id="rules-action" type="button" class="primary">Anladım</button>
      </div>
    </div>

    <div id="levels" class="overlay" hidden>
      <div class="card level-menu" role="dialog" aria-modal="true" aria-labelledby="levels-title">
        <header class="level-menu-header">
          <h2 id="levels-title">Seviyeler</h2>
          <button id="levels-close" type="button" class="icon" aria-label="Kapat">✕</button>
        </header>
        <div id="levels-body" class="level-menu-body"></div>
        <footer class="level-menu-footer">
          <button id="transfer-open" type="button">İlerlemeyi taşı</button>
          <a
            class="button coffee"
            href="https://buymeacoffee.com/mifarosa"
            target="_blank"
            rel="noopener"
            >☕ Kahve ısmarla</a
          >
        </footer>
      </div>
    </div>

    <div id="transfer" class="overlay" hidden>
      <div class="card transfer" role="dialog" aria-modal="true" aria-labelledby="transfer-title">
        <header class="dialog-header">
          <h2 id="transfer-title">İlerlemeyi taşı</h2>
          <button id="transfer-close" type="button" class="icon" aria-label="Kapat">✕</button>
        </header>
        <p>
          Bu bağlantıyı diğer cihazında aç ya da kodu orada gir. Kodu bir yere not edersen ilerlemen
          silinse bile geri alırsın.
        </p>
        <output id="transfer-code" class="transfer-code" aria-label="İlerleme kodun"></output>
        <div class="card-actions">
          <button id="transfer-copy" type="button" class="primary">Bağlantıyı kopyala</button>
          <button id="transfer-share" type="button" hidden>Paylaş</button>
        </div>
        <form id="transfer-form" class="transfer-form">
          <label for="transfer-input">Başka cihazdan kodun mu var?</label>
          <div class="transfer-row">
            <input
              id="transfer-input"
              type="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Kodu yaz"
            />
            <button type="submit">Yükle</button>
          </div>
          <p id="transfer-message" class="transfer-message" role="alert" hidden></p>
        </form>
      </div>
    </div>

    <!-- Last, so it falls over the win dialog too. -->
    <canvas id="confetti" aria-hidden="true" hidden></canvas>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
