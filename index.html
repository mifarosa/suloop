<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e1d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#d6deef" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Renkli suları tüplere ayırdığın bulmaca oyunu." />
    <title>suloop · Su sıralama oyunu</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="Oyun alanı"></canvas>

    <header class="hud">
      <div class="hud-info">
        <strong id="title">Seviye 1</strong>
        <span id="subtitle">Kolay · 0 hamle</span>
      </div>
      <nav class="hud-actions">
        <button id="undo" type="button">Geri al</button>
        <button id="hint" type="button">İpucu</button>
        <button id="restart" type="button">Baştan</button>
        <button id="levels-open" type="button" class="primary">Seviyeler</button>
      </nav>
    </header>

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="win" class="overlay" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <h2 id="win-title">Tebrikler!</h2>
        <p id="win-text"></p>
        <div class="card-actions">
          <button id="win-levels" type="button">Seviyeler</button>
          <button id="next" type="button" class="primary">Sonraki seviye</button>
        </div>
      </div>
    </div>

    <div id="levels" class="overlay" hidden>
      <div class="card level-menu" role="dialog" aria-modal="true" aria-labelledby="levels-title">
        <header class="level-menu-header">
          <h2 id="levels-title">Seviyeler</h2>
          <button id="levels-close" type="button" class="icon" aria-label="Kapat">✕</button>
        </header>
        <div id="levels-body" class="level-menu-body"></div>
        <footer class="level-menu-footer">
          <button id="transfer-open" type="button">İlerlemeyi taşı</button>
          <a
            class="button coffee"
            href="https://buymeacoffee.com/mifarosa"
            target="_blank"
            rel="noopener"
            >☕ Kahve ısmarla</a
          >
        </footer>
      </div>
    </div>

    <div id="transfer" class="overlay" hidden>
      <div class="card transfer" role="dialog" aria-modal="true" aria-labelledby="transfer-title">
        <header class="dialog-header">
          <h2 id="transfer-title">İlerlemeyi taşı</h2>
          <button id="transfer-close" type="button" class="icon" aria-label="Kapat">✕</button>
        </header>
        <p>
          Bu bağlantıyı diğer cihazında aç ya da kodu orada gir. Kodu bir yere not edersen ilerlemen
          silinse bile geri alırsın.
        </p>
        <output id="transfer-code" class="transfer-code" aria-label="İlerleme kodun"></output>
        <div class="card-actions">
          <button id="transfer-copy" type="button" class="primary">Bağlantıyı kopyala</button>
          <button id="transfer-share" type="button" hidden>Paylaş</button>
        </div>
        <form id="transfer-form" class="transfer-form">
          <label for="transfer-input">Başka cihazdan kodun mu var?</label>
          <div class="transfer-row">
            <input
              id="transfer-input"
              type="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="Kodu yaz"
            />
            <button type="submit">Yükle</button>
          </div>
          <p id="transfer-message" class="transfer-message" role="alert" hidden></p>
        </form>
      </div>
    </div>

    <!-- Last, so it falls over the win dialog too. -->
    <canvas id="confetti" aria-hidden="true" hidden></canvas>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
